<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The Pass</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Pass">
<meta name="theme-color" content="#2b3036">
<meta name="description" content="A daily kitchen service game. Same service for everyone, once a day. Run the pass, read your brigade, and decide when to split a table.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b3036'/%3E%3Cpath d='M9 5h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z' fill='%23f6f4ee'/%3E%3Crect x='12' y='10' width='8' height='2' fill='%23c0392b'/%3E%3Crect x='12' y='14' width='8' height='2' fill='%23555'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15181b;color:#e8e6df;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;max-width:520px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#2b3036 0%,#434a52 50%,#2b3036 100%);overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:calc(env(safe-area-inset-bottom) + var(--badge,0px))}
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#1e2226;border-bottom:1px solid #000;flex:none}
#clock{font:700 22px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#ffcf7a;letter-spacing:1px;min-width:62px}
#wave{flex:1;font-size:11px;color:#9aa3ab;text-transform:uppercase;letter-spacing:.08em;line-height:1.25}
#satwrap{width:86px}
.satlabel{font-size:9px;color:#9aa3ab;display:flex;justify-content:space-between;letter-spacing:.05em}
#sat{height:7px;background:#12151a;border-radius:4px;overflow:hidden;margin-top:2px}
#satfill{height:100%;width:100%;background:#58b368;transition:width .3s,background .3s}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid #0c0e10;background:#3a4047;display:grid;place-items:center;padding:0;cursor:pointer}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:#e8e6df;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#brigade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 8px 0;flex:none}
.stn{background:#343a41;border:1px solid #1b1f23;border-radius:8px;padding:4px 7px;min-height:40px}
.stn b{display:block;font-size:11px;letter-spacing:.06em}
.stn small{display:flex;align-items:center;gap:5px;font-size:10px;color:#aab2b9}
.dot{width:8px;height:8px;border-radius:50%;background:#58b368;flex:none}
.stn.busy .dot{background:#e6b04a}
.stn.weeds .dot{background:#d9534f;animation:pulse .7s infinite}
.stn.weeds{border-color:#7a2f2d}
@keyframes pulse{50%{opacity:.35}}
#bubble{height:26px;margin:4px 8px 0;display:flex;align-items:center;flex:none}
.bub{background:#f6f4ee;color:#1d1d1d;border-radius:14px;padding:4px 11px;font-size:12.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:bubin .15s ease-out}
.bub.fade{opacity:0;transition:opacity .6s}
.bub b{font-size:10px;letter-spacing:.07em;margin-right:6px;color:#8a5a00}
@keyframes bubin{from{transform:translateY(4px);opacity:0}}
#strip{display:flex;align-items:center;gap:14px;padding:4px 10px 0;height:30px;flex:none;font-size:10px;letter-spacing:.07em;color:#aab2b9}
#strip b{font:700 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#e8e6df;margin-left:5px;letter-spacing:0}
#printer{width:22px;height:22px;flex:none}
#printer svg{width:22px;height:22px;fill:#8a929a}
#printer.feeding svg{animation:flash .9s}
@keyframes flash{0%,60%{fill:#ffcf7a}100%{fill:#8a929a}}
#runners{margin-left:auto;display:flex;align-items:center;gap:6px}
#rdots{display:flex;gap:4px}
.rdot{width:22px;height:22px;border-radius:50%;background:#58b368;display:grid;place-items:center;font:700 10px ui-monospace,Menlo,Consolas,monospace;color:#0c2412}
.rdot.busy{background:#4b5157;color:#d0d4d8}
#board{flex:1 1 auto;min-height:0;margin:2px 8px 0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.tk{flex:none;background:#f6f4ee;color:#1d1d1d;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;border-radius:4px;padding:5px 7px 7px;box-shadow:0 2px 3px #0008;border-left:5px solid #b8bec4;animation:tkin .25s ease-out;cursor:pointer}
@keyframes tkin{from{transform:translateY(-10px);opacity:0}}
.tk.over{border-left-color:#c0392b}
.tk.sel{outline:2px solid #ffb347}
.tk.out{opacity:0;transform:translateX(30px);transition:all .25s}
.th{display:flex;align-items:center;gap:8px;min-height:30px}
.th b{font-size:17px}
.th .cv{font-size:11px;color:#666}
.th .tt{font-size:17px;font-weight:700}
.th .tt.over{color:#c0392b}
.th .tt.late{animation:pulse .6s infinite}
.ttags{display:flex;gap:4px;flex:1;min-width:0;flex-wrap:wrap}
.tag{font-size:9px;font-weight:700;color:#c0392b;border:1px solid #c0392b;border-radius:3px;padding:0 3px;letter-spacing:.04em;white-space:nowrap}
.tsend{display:none;margin-left:auto;height:30px;padding:0 12px;border-radius:7px;border:2px solid #101214;font:800 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;cursor:pointer;flex:none}
.tsend.full{display:block;background:#58b368;color:#0c2412;box-shadow:0 0 10px #58b36888}
.tsend.split{display:block;background:#e6b04a;color:#2a1c00;box-shadow:0 0 10px #e6b04a88}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:3px}
.chip{border:2px solid #1d1d1d22;border-left:5px solid #888;border-radius:6px;padding:3px 6px;min-height:42px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow:hidden;background:#fff;min-width:0}
.chip.grill{border-left-color:#b3452f}.chip.pan{border-left-color:#b9801a}.chip.larder{border-left-color:#3f8f6b}.chip.garnish{border-left-color:#4a78b5}
.chip .cn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cs{font-size:11px;font-weight:700;white-space:nowrap}
.chip.s-unfired{background:#1d1d1d;color:#f6f4ee}
.chip.s-unfired .cs{color:#ffcf7a}
.chip.s-cooking{background:#fff1cf}
.chip.s-cooking .cs{color:#a65f00;animation:pulse 1s infinite}
.chip.s-plated{background:#e1f3e5}
.chip.s-plated .cs{color:#237a3a}
.chip.held{outline:2px dashed #888}
.chip.dead{background:#fde2e0;border-color:#d9534f}
.chip.dead .cs{color:#c0392b}
.chip.s-sent{opacity:.45;text-decoration:line-through}
.chip.hold{background:#e6e3da;color:#8a8780;border-style:dashed}
.chip.hold .cs{color:#8a8780}
.crs{grid-column:1/-1;font:700 9.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;color:#777;margin:1px 0 -2px;display:flex;gap:6px;align-items:center}
.crs::after{content:'';flex:1;border-top:1px dashed #bbb}
.crs.away{color:#237a3a}
.stn{cursor:pointer}
.stn.helped{border-color:#ffcf7a;box-shadow:0 0 10px #ffcf7a88}
.stn.helping{opacity:.65}
.chip.alg{box-shadow:inset 0 0 0 2px #c0392b}
#window{margin:4px 8px 0;height:112px;flex:none;background:radial-gradient(ellipse at 50% -10%,#ffb34766,#3a3f45 72%),#3a3f45;border:2px solid #14171a;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow-y:auto;position:relative;box-shadow:inset 0 0 22px #ff9a2e22}
.plate{width:58px;height:58px;background:#1e2226aa;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;position:relative;cursor:pointer}
.plate svg{width:38px;height:38px}
.plate .ringbg{fill:#161a1d;stroke:#0d0f11;stroke-width:5}
.plate .ring{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:0}
.plate text{font:700 9px ui-monospace,Menlo,Consolas,monospace;fill:#f1efe8}
.plate .tn{font:700 9.5px ui-monospace,Menlo,Consolas,monospace;color:#cfd3d7;margin-top:-1px}
.plate.sel{border-color:#ffb347;background:#4a3a20aa}
.plate.off{opacity:.5}
.plate.dead{filter:grayscale(1);border-color:#d9534f;animation:pulse 1s infinite}
.plate.dying{border-color:#e6b04a;animation:lamp .7s infinite}
@keyframes lamp{50%{border-color:#ff5a36;box-shadow:0 0 14px #ff5a36aa;background:#5a2a1caa}}
.chef{font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;margin:8px 6px 2px;color:#1d1d1d}
.chef small{display:block;font:700 9.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#8a5a00;margin-bottom:3px}
.plate.dead .tn{color:#ff8a85}
#winlabel{position:absolute;right:8px;bottom:3px;font-size:9px;letter-spacing:.25em;color:#ffffff30;pointer-events:none}
#toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:#101214ee;color:#fff;padding:7px 14px;border-radius:18px;font-size:13px;pointer-events:none;opacity:0;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:5}
#toast.on{animation:toast 2.2s}
#toast.bad{background:#7a2320ee}
@keyframes toast{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
.ov{position:absolute;inset:0;background:#0a0c0ecc;display:none;align-items:center;justify-content:center;padding:14px 14px calc(14px + var(--badge,0px));z-index:10;overflow-y:auto}
.card{background:#f6f4ee;color:#1d1d1d;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;width:100%;max-width:380px;padding:18px 18px 22px;border-radius:3px;box-shadow:0 8px 28px #000a;max-height:100%;overflow-y:auto}
.card h1{margin:0;text-align:center;letter-spacing:.3em;font-size:26px}
.card .sub{text-align:center;font-size:12px;margin:2px 0 12px;color:#555}
.card .how{font:12.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#333;margin:10px 0 12px}
.rule{border-top:2px dashed #1d1d1d;margin:10px 0}
.modes{display:grid;gap:6px;margin:8px 0 12px}
.mode{border:2px solid #1d1d1d;background:transparent;border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer;font-family:inherit;color:#1d1d1d}
.mode b{display:block;font-size:14px}
.mode small{font-size:11px;color:#555}
.mode.on{background:#1d1d1d;color:#f6f4ee}
.mode.on small{color:#c8c6bf}
.mode.locked{opacity:.45;cursor:default}
.go{width:100%;padding:13px;border:0;border-radius:6px;background:#c0392b;color:#fff;font:800 16px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;cursor:pointer}
.go.alt{background:#1d1d1d;margin-top:8px}
.stats{text-align:center;font-size:11px;color:#555;margin-top:10px}
.rrow{display:flex;align-items:baseline;gap:6px;font-size:13px;padding:3px 0}
.rrow i{flex:1;border-bottom:2px dotted #999;transform:translateY(-3px)}
.rrow b{font-size:14px}
.big{text-align:center;margin:6px 0}
.big .pct{font-size:44px;font-weight:800;line-height:1}
.big .stars{font-size:24px;letter-spacing:.12em;color:#b9801a}
.note{text-align:center;font-size:12px;margin:8px 0 2px;color:#237a3a;font-weight:700}
.note.bad{color:#c0392b}
.note.dim{color:#555;font-weight:400}
#coach{display:none;margin:4px 8px 0;flex:none;background:#ffcf7a;color:#1d1d1d;border-radius:9px;padding:6px 10px;font-size:13.5px;font-weight:600;line-height:1.3;min-height:36px;align-items:center;gap:8px;box-shadow:0 2px 6px #0006}
#coach.on{display:flex}
#coach b{flex:none;font:800 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;background:#1d1d1d;color:#ffcf7a;border-radius:4px;padding:2px 5px}
#coach span{animation:bubin .15s ease-out}
.bub.chef{background:#ffcf7a}
.daily{display:block;width:100%;text-align:left;border:0;border-radius:6px;background:#c0392b;color:#fff;padding:12px 14px;cursor:pointer;font-family:inherit}
.daily b{display:block;font-size:18px;letter-spacing:.08em}
.daily small{display:block;font-size:11.5px;opacity:.9;margin-top:2px}
.daily.done{background:#1d1d1d}
.daily.done .stars{color:#ffcf7a}
.sect{font-size:10px;letter-spacing:.2em;color:#555;margin:12px 0 4px}
.mode.next{border-color:#c0392b;box-shadow:inset 4px 0 0 #c0392b}
.links{display:flex;gap:6px;margin-top:10px}
.hero{background:#c0392b;color:#fff;border-radius:10px;padding:16px 14px 14px;text-align:center;margin:4px 0 6px;box-shadow:0 3px 0 #8e2a1f}
.hero.done{background:#1d1d1d;box-shadow:0 3px 0 #000}
.hero .k{font:700 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;opacity:.85}
.hero .n{font:800 38px/1.05 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;margin:4px 0 2px}
.hero .d{font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hero .f{font-size:11.5px;opacity:.85;margin-top:4px}
.hero .stars{color:#ffcf7a;font-size:22px;letter-spacing:.1em}
.hero .sq{font-size:13px;margin:6px 0 2px}
.hero .hb{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:7px;background:#fff;color:#c0392b;font:800 16px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;cursor:pointer}
.hero.done .hb{background:#c0392b;color:#fff}
.hero .hrow{display:flex;gap:6px;margin-top:6px}
.hero .hrow button{flex:1;padding:9px 4px;border:2px solid #ffffff55;border-radius:7px;background:transparent;color:#fff;font:700 11.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;cursor:pointer}
.hint{text-align:center;font-size:12px;margin:8px 0 0}
.hint a{color:#c0392b;font-weight:700}
.links button{flex:1;border:2px solid #1d1d1d;background:transparent;border-radius:6px;padding:8px 4px;font:700 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;cursor:pointer;color:#1d1d1d}
.card input{display:block;width:100%;font:16px ui-monospace,Menlo,Consolas,monospace;padding:9px 10px;border:2px solid #1d1d1d;border-radius:6px;background:#fff;color:#1d1d1d;-webkit-user-select:text;user-select:text;margin:3px 0 8px}
.card label{font-size:11px;letter-spacing:.08em;color:#555}
.err{color:#c0392b;font-size:12px;min-height:16px;margin:2px 0 6px}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.sugg button{border:1px solid #1d1d1d;background:#fff;border-radius:12px;padding:3px 9px;font:12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;color:#1d1d1d}
.snums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;margin:10px 0 4px}
.snums b{display:block;font-size:26px;line-height:1.1}
.snums small{display:block;font-size:10px;color:#555;line-height:1.2}
.dist{margin:6px 0 4px}
.drow{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.drow span{width:62px;flex:none;color:#b9801a;letter-spacing:.05em;font-size:11px;text-align:right}
.drow i{display:block;font-style:normal;background:#8a929a;color:#fff;font-weight:700;padding:1px 6px;text-align:right;min-width:20px;border-radius:2px}
.drow i.now{background:#58b368}
.sq{font-size:15px;line-height:1.15;text-align:center;letter-spacing:1px;margin:6px 0;word-break:break-all}
.prose{font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#333}
.prose p{margin:8px 0}
.prose a{color:#c0392b;font-weight:700}
.small{font-size:10.5px;color:#777}
.verdict{font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;margin:10px 4px;color:#1d1d1d}
.ov.solid{background:#0a0c0e}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="clock">18:00</div>
    <div id="wave">Early Doors</div>
    <div id="satwrap"><div class="satlabel"><span>DINING ROOM</span><span id="satpct">100%</span></div><div id="sat"><div id="satfill"></div></div></div>
    <button class="iconbtn" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="iconbtn" id="btnMute" aria-label="Sound"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
  </div>
  <div id="brigade"></div>
  <div id="bubble"></div>
  <div id="strip">
    <div id="printer"><svg viewBox="0 0 32 32"><path d="M8 3h16v8H8zM3 12h26v12h-5v-5H8v5H3zM9 21h14v8H9z"/></svg></div>
    <span>ON THE RAIL<b id="openN">0</b></span>
    <span>AWAY<b id="spikeN">0</b></span>
    <div id="runners">RUNNERS<span id="rdots"></span></div>
  </div>
  <div id="coach"><b>CHEF</b><span id="coachTx"></span></div>
  <div id="board"></div>
  <div id="window"><span id="winlabel">THE PASS</span></div>
  <div id="toast"></div>
  <div id="ov" class="ov"></div>
</div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const DURATION = 330;      // real seconds for 18:00 to 22:00 in Practice
const SPAWN_END = 205;     // game minutes after which no new tickets print, in the full length service
// Real seconds between the last new ticket and 22:00. Fixed, so a shorter service (the daily) gives the last
// tables the same time to cook as the full one does, instead of cutting them off at close.
const LAST_CALL = DURATION*(1-SPAWN_END/240);
const SLOW_SQUARE = 1.4;   // a ticket this many times over its par time shows amber on the share card
const GRACE = 28;          // split table grace window, real seconds
// 22:00 shuts the doors, not the kitchen: tables already on the rail are still cooked and sent after it,
// and the service ends once the rail is clear. Tables left far too long still walk out as normal.
const SAVE_KEY = 'thepass.save.v1';
const SESSION_KEY = 'thepass.session.v1';

const ST = {
  grill:   {label:'GRILL',   tag:'GRILL',  free:6, cap:10, decay:1.1, slow:.12, optimistic:false},
  pan:     {label:'PAN',     tag:'PAN',    free:4, cap:8, decay:1.9, slow:.2, optimistic:true},
  larder:  {label:'LARDER',  tag:'LARDER', free:6, cap:10, decay:3.0, slow:.08, optimistic:false},
  garnish: {label:'GARNISH', tag:'FRYER',  free:6, cap:10, decay:4.2, slow:.1, optimistic:false}
};
const KEYS = ['grill','pan','larder','garnish'];
const MENUS = {
  main: {
    grill:   [['Ribeye Steak','RIB',30,'Ribeye'],['Lamb Rump','LMB',28,'Lamb'],['Burger','BGR',22,'Burger']],
    pan:     [['Duck Breast','DCK',24,'Duck'],['Sea Bass','BAS',18,'Sea Bass'],['Risotto','RIS',22,'Risotto']],
    larder:  [['Burrata Salad','BRT',8,'Burrata'],['Tartare','TAR',9,'Tartare'],['Prawn Cocktail','PRN',7,'Prawn']],
    garnish: [['Triple-Cooked Chips','CHP',12,'Chips'],['Greens','GRN',8,'Greens'],['Onion Rings','RNG',10,'Rings']]
  },
  // Sunday: a roast service. Same four sections, different plates.
  roast: {
    grill:   [['Roast Sirloin','BEF',26,'Sirloin'],['Lamb Shoulder','SHL',28,'Lamb'],['Pork Belly','PRK',24,'Pork']],
    pan:     [['Roast Chicken','CHK',22,'Chicken'],['Sea Bass','BAS',18,'Sea Bass'],['Nut Roast','NUT',20,'Nut Roast']],
    larder:  [['Prawn Cocktail','PRN',7,'Prawn'],['Chicken Liver Pate','PAT',8,'Pate'],['Smoked Salmon','SMK',7,'Salmon']],
    garnish: [['Roast Potatoes','ROA',12,'Roasties'],['Yorkshire Pudding','YRK',10,'Yorkies'],['Cauliflower Cheese','CCH',9,'Cauli']]
  }
};
const WAVES = [

/* ---------- seeded randomness ----------
   Every gameplay roll comes from a generator keyed to (service seed, purpose). Each ticket, each firing of a dish,
   each check and each runner gets its own stream, so the night is the same for everyone whatever order they play in,
   and the same seed with the same actions always gives the same result. */
function hashSeed(str){
  let h1=1779033703, h2=3144134277, h3=1013904242, h4=2773480762;
  for(let i=0;i<str.length;i++){ const k=str.charCodeAt(i);
    h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233); h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044179); }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233); h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044179);
  return (h1^h2^h3^h4)>>>0;
}
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const seeded = key => mulberry32(hashSeed(key));
const rng = key => seeded(G.seed+'|'+key);

/* ---------- procedural audio ---------- */
const A = {
  ctx:null, master:null, nb:null, muted:false,
  unlock(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
      this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = .8; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.nb = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d = this.nb.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    }catch(e){ this.ctx=null; }
  },
  ok(){ return !!this.ctx && !this.muted; },
  noise(delay,dur,o){
    if(!this.ok()) return; o=o||{};
    const c=this.ctx, t0=c.currentTime+delay, s=c.createBufferSource(); s.buffer=this.nb;
    const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||2000,t0);
    if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t0+dur); f.Q.value=o.q||1;
    const g=c.createGain(); g.gain.setValueAtTime(o.g||.1,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0); s.stop(t0+dur+.03);
  },
  tone(delay,fr,dur,o){
    if(!this.ok()) return; o=o||{};
    const c=this.ctx, t0=c.currentTime+delay, os=c.createOscillator(); os.type=o.type||'sine';
    os.frequency.setValueAtTime(fr,t0); if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t0+dur);
    const g=c.createGain(); g.gain.setValueAtTime(o.g||.1,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    os.connect(g); g.connect(this.master); os.start(t0); os.stop(t0+dur+.03);
  },
  printer(){ for(let i=0;i<9;i++) this.noise(i*.055,.035,{f:2600+Math.random()*900,q:2.5,g:.07}); },
  swipe(){ this.noise(0,.16,{type:'highpass',f:1500,f2:5200,g:.1}); },
  tap(){ this.tone(0,150,.09,{g:.18,f2:70}); this.noise(0,.03,{f:900,q:1,g:.05}); },
  clink(){ this.tone(0,2350,.14,{g:.07}); this.tone(.012,3180,.1,{g:.05}); this.noise(0,.02,{type:'highpass',f:5000,g:.05}); },
  spike(){ this.noise(0,.05,{type:'highpass',f:1200,g:.18}); this.tone(0,120,.07,{type:'square',g:.08,f2:60}); },
  err(){ this.tone(0,120,.18,{type:'sawtooth',g:.07,f2:80}); },
  bell(){
    if(!this.ok()) return;
    const c=this.ctx, t0=c.currentTime;
    [[1760,1],[2637,.5]].forEach(p=>{
      const car=c.createOscillator(), mod=c.createOscillator(), mg=c.createGain(), g=c.createGain();
      car.frequency.value=p[0]; mod.frequency.value=p[0]*1.41;
      mg.gain.setValueAtTime(p[0]*1.6,t0); mg.gain.exponentialRampToValueAtTime(1,t0+1.1);
      g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.16*p[1],t0+.006); g.gain.exponentialRampToValueAtTime(.0001,t0+1.4);
      mod.connect(mg); mg.connect(car.frequency); car.connect(g); g.connect(this.master);
      car.start(t0); mod.start(t0); car.stop(t0+1.5); mod.stop(t0+1.5);
    });
  }
};

/* The whole night's ticket times are planned up front from the seed. If the rail is jammed a ticket waits,
   but its contents never change, so every player gets the same tickets in the same order. */
function planService(waveOverride, endAt){
  const dur=G.cfg.duration, plan=[];
  let t=2;
  for(;;){
    const m=t*240/dur;
    if(endAt!=null ? t>=endAt : t>=dur-LAST_CALL) break;
    const w=waveOverride||waveAt(m);
    plan.push({at:t, w});
    t += rand(G.rT,w.int[0],w.int[1])*G.cfg.int;
  }
  G.plan=plan;
}

/* ---------- tickets ---------- */
function nextTable(){
  const used = new Set(openTickets().map(t=>t.table));
  for(let i=0;i<20;i++){ G.tn = (G.tn%14)+1; if(!used.has(G.tn)) return G.tn; }
  return G.tn;
}
function mkDish(it,key){ return {id:G.did++,tid:0,key,name:it[0],abbr:it[1],base:it[2],short:it[3],state:'unfired',rem:0,q:100,dead:false,sel:true,mods:{},refire:false,early:false,sentQ:0,fires:0,checks:0,slowMul:1,course:1,hold:false,ui:{}}; }
function findDish(abbr){ const menu=MENUS[G.cfg.menu]; for(const k of KEYS){ const it=menu[k].find(x=>x[1]===abbr); if(it) return [it,k]; } return null; }
// r: the ticket's own seeded generator. spec: a scripted Stage ticket instead of a random one.
function makeTicket(w,r,spec){
  const menu=MENUS[G.cfg.menu], ds=[];
  let covers, allergy=false, rush=false, vip=false, multi=false;
  if(spec){
    covers=spec.covers||2;
    spec.dishes.forEach(x=>{ const a=typeof x==='string'?{a:x}:x; const f=findDish(a.a); const d=mkDish(f[0],f[1]); if(a.slow) d.slowMul=a.slow; ds.push(d); });
  } else {
    covers = pick(r,w.cov);
    const add = key => { const d=mkDish(pick(r,menu[key]),key); ds.push(d); return d; };
    for(let i=0;i<covers;i++){
      if(r()<.38) add('larder');
      add(r()<.5?'grill':'pan');
      if(r()<.32) add('garnish');
    }
    while(ds.length>9) ds.pop();
    allergy = r()<w.allergy;
    rush = r() < w.rush + (w.idx>=2 ? G.cfg.rush : 0);
    vip = r()<w.vip;
    if(allergy){ const mains=ds.filter(d=>d.key==='grill'||d.key==='pan'); pick(r,mains).mods.allergy=pick(r,ALLERGIES); }
    ds.forEach(d=>{ if(d.key==='garnish'&&r()<w.xc) d.mods.xc=true; });
    // Two courses: the larder dishes go first as starters, everything else waits for the away call.
    if(G.cfg.courses && w.idx>=1 && ds.some(d=>d.key==='larder') && ds.some(d=>d.key==='grill'||d.key==='pan') && r()<.4){
      multi=true;
      ds.forEach(d=>{ if(d.key!=='larder'){ d.course=2; d.hold=true; } });
      ds.sort((a,b)=>a.course-b.course);
    }
  }
  ds.forEach(d=>{
    let f=1; if(d.mods.allergy) f*=1.25; if(d.mods.xc) f*=1.35;
    d.base=Math.round(d.base*f);
  });
  const t = {id:G.tid++, table:nextTable(), covers, born:G.t, dishes:ds, rush, vip, allergy, done:false, walked:false,
             par:(45+6*ds.length)*(rush?.78:1)*(vip?.9:1)*(G.cfg.parMul||1), wave:w.name, splitAt:null, gap:null, refires:0, ui:{}, allergyText:allergy?(ds.find(d=>d.mods.allergy).mods.allergy):''};
  t.multi=multi; t.course=1; t.cStart=G.t; t.eatUntil=null; t.tsList=[]; t.waitTot=0; t.pen=0; t.anySplit=false; t.lateAny=false;
  t.parC = multi ? coursePar(t,1) : t.par;
  ds.forEach(d=>{ d.tid=t.id; G.dmap[d.id]=d; });
  G.tickets.push(t); G.tmap[t.id]=t;
  G.log.push(ds.map(d=>d.abbr+(d.mods.allergy?'!':'')+(d.mods.xc?'+':'')).join(',')+(rush?'|R':'')+(vip?'|V':''));
  printerEl.classList.remove('feeding'); void printerEl.offsetWidth; printerEl.classList.add('feeding');
  A.printer();
  stageEvent('spawn',t);
  return t;
}
function coursePar(t,c){ const n=t.dishes.filter(d=>d.course===c).length; return (45+6*n)*(t.rush?.78:1)*(t.vip?.9:1)*(G.cfg.parMul||1); }
const inCourse = (t,d) => !t.multi || d.course===t.course;
const eating = t => t.eatUntil!=null;
const ageOf = t => eating(t) ? 0 : G.t-t.cStart;
function callMains(t){
  t.eatUntil=null; t.course=2; t.cStart=G.t; t.parC=coursePar(t,2); t.readyNoted=false;
  t.dishes.forEach(d=>{ d.hold=false; });
  printerEl.classList.remove('feeding'); void printerEl.offsetWidth; printerEl.classList.add('feeding');
  A.printer(); say('WAITER','Table '+t.table+', away mains!');
}
function trySpawn(){
  const p=G.plan[G.pi]; if(!p || G.t < p.at+G.delay) return;
  const open=openTickets();
  const load = open.reduce((a,t)=>a+t.dishes.filter(d=>d.state==='unfired'||d.state==='cooking').length,0);
  if(open.length>=10 || load>34){ G.delay=G.t+1.5-p.at; return; }
  makeTicket(p.w, rng('ticket|'+G.pi));
  G.pi++;
}

  const t=G.tmap[d.tid]; if(!t||t.done||d.state!=='unfired') return;
  if(d.hold){ toast('Mains on hold. Table '+t.table+(eating(t)?' is eating starters.':' is still on starters.'),true); A.err(); return; }
  if(d.key==='larder' && G.help){ say('larder','I\'m on the '+ST[G.help.key].tag.toLowerCase()+', chef!'); A.err(); return; }
  const arr=G.stn[d.key];
  if(arr.length>=ST[d.key].cap){ say(d.key,'Hands full, chef!'); A.err(); return; }
  const r=rng('fire|'+d.id+'|'+(d.fires++));
  d.state='cooking'; d.rem=d.base*rand(r,.94,1.06)*d.slowMul;
  d.early = d.key==='larder' && !G.cfg.noEarly && r()<.16; if(d.early) d.rem*=.5;
  arr.push(d); A.tap(); say(d.key,cpick(ACK));
  stageEvent('fire',d,t);
}
function checkDish(d){
  const k=d.key;
  if(G.t-G.chk[k]<1.5){ d.rem+=1.2; say(k,'I heard you, chef!'); A.tap(); return; }
  G.chk[k]=G.t;
  const r=rng('check|'+d.id+'|'+(d.checks++));
  const arr=G.stn[k], rt=rate(k,arr.length);
  let est = ST[k].optimistic ? d.rem+rand(r,-2,2) : d.rem/rt+rand(r,-3,3);
  est=Math.max(0,est);
  let msg;
  if(k==='pan' && arr.length>=ST.pan.free+1 && r()<.35) msg='Dragging on the '+d.name.toLowerCase()+', give me a minute!';
  else if(est<4) msg='Plating now!';
  else msg=numWord(Math.max(5,Math.round(est/5)*5))+' seconds, chef!';
  d.rem+=.6; A.tap(); say(k,msg);
  stageEvent('check',d,msg);
}
function plateDish(d){
  const arr=G.stn[d.key], i=arr.indexOf(d); if(i>=0) arr.splice(i,1);
  d.state='plated'; d.q = d.early?82:100; d.dead=false; d.sel=true;
  A.clink();
  if(d.early) say(d.key,'Dropped it early, chef!');
  stageEvent('plate',d);
}
function binDish(d){
  const t=G.tmap[d.tid]; if(!t||t.done||!d.dead) return;
  d.state='unfired'; d.dead=false; d.q=100; d.refire=true; d.sel=true; t.refires++; G.refires++;
  A.tap(); toast('Binned. Refire it, chef!',true);
  stageEvent('bin',d);
}

/* ---------- sending and scoring ---------- */
function selectTicket(id){ if(G.sel===id) return; G.sel=id; A.swipe(); }
function readyPlates(t){ return t.dishes.filter(d=>inCourse(t,d)&&d.state==='plated'&&!d.dead&&d.sel); }
function remainingOf(t){ return t.dishes.filter(d=>inCourse(t,d)&&d.state!=='sent'&&d.state!=='gone').length; }
function sendTicket(t){
  if(!t||t.done||!G||G.over||G.paused) return;
  const plates=readyPlates(t);
  if(!plates.length){ toast('Nothing ready on table '+t.table,true); A.err(); return; }
  const ri=G.runners.findIndex(x=>x<=0);
  if(ri<0){ toast('No runners free, chef!',true); A.err(); return; }
  const all = plates.length===remainingOf(t);
  plates.forEach(d=>{ d.state='sent'; d.sentQ=d.q; G.sentQs.push(d.q); });
  G.runners[ri]=rand(rng('run|'+(G.sends++)),6,8);
  A.bell();
  if(all){
    closeCourse(t);
    if(t.multi && t.course===1){
      t.eatUntil = G.t + rand(rng('eat|'+t.id),18,28);
      toast('Starters away, table '+t.table+'. Mains when they call.');
    } else finishTicket(t);
  } else if(t.splitAt==null){ t.splitAt=G.t; stageEvent('split',t); }
}
function sendSel(){ sendTicket(selT()); }
function settle(t,score,walked){
  G.scores.push({s:score,w:t.vip?2:1,wave:t.wave,table:t.table,late:walked||t.lateAny});
  G.sat = clamp(G.sat + (score-62)*.2 - (walked?4:0), 0, 100);
  if(score>=75){ G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak); } else G.streak=0;
}
function retire(t){
  t.done=true; G.lastDone=G.t;
  const c=t.ui.card;
  if(c){ c.classList.add('out'); setTimeout(()=>{ if(c.parentNode) c.remove(); },260); }
  if(G.sel===t.id) G.sel=0;
}
// Times and splits are judged per course. A one-course ticket is simply a single course.
function closeCourse(t){
  const wait=G.t-t.cStart, over=Math.max(0,wait-t.parC);
  t.tsList.push(clamp(100-over*2*(t.allergy?1.4:1),0,100));
  t.waitTot+=wait; if(wait>t.parC) t.lateAny=true;
  if(wait>t.parC*SLOW_SQUARE) t.slowAny=true;
  if(t.splitAt!=null){
    const gap=G.t-t.splitAt; t.anySplit=true; t.gap=gap;
    if(gap>GRACE){ t.pen+=Math.min(45,(gap-GRACE)*1.5); G.awkward++; t.awkwardAny=true; } else G.clean++;
    t.splitAt=null;
  }
}
function finishTicket(t){
  const fr=t.dishes.reduce((a,d)=>a+d.sentQ,0)/t.dishes.length;
  const ts=t.tsList.reduce((a,b)=>a+b,0)/t.tsList.length;
  const pen=t.pen+t.refires*10;
  const score=Math.round(clamp(.5*fr+.5*ts-pen,0,100));
  t.score=score;
  G.served++; G.covers+=t.covers; G.waits.push(t.waitTot);
  // The share squares say how the table went. A clean split is good kitchen craft (get the table moving, give
  // veg the minute it needs), so it stays green. Amber is a struggle: an awkward split, or a ticket well over time.
  G.grid += t.refires>0 ? 'r' : (t.awkwardAny || t.slowAny) ? 'a' : 'g';
  settle(t,score,false);
  G.spiked++; $('#spikeN').textContent=G.spiked; A.spike();
  retire(t);
  toast('Table '+t.table+' away: '+score+'%', score<55);
  stageEvent('away',t);
}
function walkout(t,silent){
  if(t.done) return;
  t.dishes.forEach(d=>{
    const arr=G.stn[d.key], i=arr.indexOf(d); if(i>=0) arr.splice(i,1);
    d.state='gone';
  });
  G.walked++; if(t.splitAt!=null) G.awkward++;
  G.grid += 'r';
  t.score=0; settle(t,0,true); retire(t);
  if(!silent){ toast('Table '+t.table+' walked out!',true); A.err(); stageEvent('walk',t); }
}

/* ---------- update ---------- */
function update(dt){
  if(!G||G.over||G.paused) return;
  G.t+=dt;
  G.min=Math.min(240,G.t*240/G.cfg.duration);
  if(G.kind==='stage') stageTick(dt);
  if(G.kind==='stage' || G.t<G.cfg.duration-LAST_CALL) trySpawn();
  for(const key of KEYS){
    const arr=G.stn[key]; if(!arr.length) continue;
    const r=rate(key,arr.length);
    for(const d of arr.slice()){ d.rem-=dt*r; if(d.rem<=0) plateDish(d); }
  }
  let overdue=0;
  for(const t of G.tickets){
    if(t.done) continue;
    for(const d of t.dishes){
      if(d.state==='plated'&&!d.dead){
        d.q-=ST[d.key].decay*(d.mods.xc?.6:1)*(G.cfg.decayMul[d.key]||1)*dt;
        if(d.q<=0){ d.q=0; d.dead=true; G.dead++; say(d.key,'Dead plate on table '+t.table+'!'); A.err(); toast('Dead plate. Bin it and refire.',true); stageEvent('dead',d); }
      }
    }
    if(eating(t)){ if(G.t>=t.eatUntil) callMains(t); continue; }
    const age=ageOf(t);
    if(age>t.parC) overdue++;
    if(age>t.parC*2.2) walkout(t);
  }
  helpTick();
  newbieNudge();
  G.sat=Math.max(0,G.sat-.06*overdue*dt);
  for(let i=0;i<G.runners.length;i++) if(G.runners[i]>0) G.runners[i]=Math.max(0,G.runners[i]-dt);
  if(G.over) return;
  if(G.min>=240&&!G.closing){ G.closing=true; G.closeAt=G.t; toast('22:00. Doors shut. Get the last tables out.'); }
  if(G.sat<=0) return endGame('empty');
  if(G.closing && openTickets().length===0) endGame('closed');
}

/* ---------- larder helping out ----------
   The starters chef with nothing on can jump on a section that's buried. Two goes a service (Practice for now).
   While they're away, nothing new can go on larder. */
/* New players often fire one ticket and wait for it (Sarah did). For their first few services the head chef
   tells them, at most twice, if a fresh ticket sits untouched while another one cooks. Words only, no score change. */
function newbieNudge(){
  if(G.kind==='stage' || save.played>=4 || (G.nudges||0)>=2 || G.t<(G.nudgeAt||0)) return;
  const open=openTickets();
  const idle=open.find(t=>G.t-t.born>6 && t.dishes.every(d=>d.state==='unfired'));
  const busy=open.some(t=>t.dishes.some(d=>d.state==='cooking'));
  if(idle && busy){
    say('HEAD CHEF','Don\'t wait, chef. Fire table '+idle.table+' while that one cooks.');
    G.nudges=(G.nudges||0)+1; G.nudgeAt=G.t+25;
  }
}
function helpTick(){
  if(G.help && G.t>=G.help.until){ say('larder','Back on larder, chef!'); G.help=null; }
  if(!G.helps || G.help || G.stn.larder.length || G.t<G.helpHint) return;
  for(const k of ['grill','pan','garnish']){
    if(G.stn[k].length>ST[k].free){ say('larder','Larder\'s free, chef. Want me on '+ST[k].tag.toLowerCase()+'? Tap it.'); G.helpHint=G.t+20; return; }
  }
}
function sendHelp(k){
  if(!G||G.over||G.paused||!G.cfg.helps) return;
  if(k==='larder'){ say('larder', G.help?'On the '+ST[G.help.key].tag.toLowerCase()+', chef!':G.helps?'Free hands here. Tap a section and I\'ll jump on it. '+G.helps+' left.':'No more spare hands tonight, chef.'); return; }
  if(G.help){ toast('Larder is already on the '+ST[G.help.key].tag.toLowerCase()+'.',true); return; }
  if(!G.helps){ toast('No more spare hands tonight.',true); A.err(); return; }
  if(G.stn.larder.length){ say('larder','Still got starters on, chef!'); A.err(); return; }
  G.help={key:k, until:G.t+HELP_SECS}; G.helps--; G.helpUsed++;
  say('larder','Jumping on '+ST[k].tag.toLowerCase()+', chef!'); A.tap();
}

/* ---------- the Stage ----------
   Short guided services. The head chef talks you through each one live, one skill at a time. */
function coach(text, now){
  if(!G||G.kind!=='stage') return;
  if(now){ G.coachQ=[]; G.coachUntil=0; }
  G.coachQ.push(text);
}
function coachTick(){
  if(!G.coachQ.length || G.t<G.coachUntil) return;
  const tx=G.coachQ.shift();
  coachTx.textContent=tx; coachTx.style.animation='none'; void coachTx.offsetWidth; coachTx.style.animation='';
  G.coachUntil=G.t+Math.max(2.4,tx.length*.055);
}
function stageEvent(name){
  if(!G||G.kind!=='stage'||!G.sd.on||!G.sd.on[name]) return;
  G.sd.on[name].apply(null, Array.prototype.slice.call(arguments,1));
}
function stageSetup(){
  const sd=G.sd;
  G.script = (sd.tickets||[]).map(x=>Object.assign({},x));
  if(sd.rush){ planService(WAVES[2], sd.rush); }
  (sd.intro||[]).forEach(l=>coach(l));
}
function stageTick(dt){
  const open=openTickets();
  // Scripted tickets: at a time, or a beat after the rail clears.
  const nx=G.script[0];
  if(nx && ((nx.after && open.length===0 && G.t>=G.lastDone+(nx.after)) || (!nx.after && G.t>=nx.at))){
    G.script.shift(); makeTicket(WAVES[0], null, nx);
  }
  // A table becomes ready to send.
  for(const t of open){
    if(!t.readyNoted && readyPlates(t).length && readyPlates(t).length===remainingOf(t)){ t.readyNoted=true; stageEvent('ready',t); }
  }
  stageEvent('tick',dt,open);
  coachTick();
  const done = !G.script.length && G.pi>=G.plan.length && open.length===0 && G.tickets.length>0;
  if(done){ if(!G.sv.endAt) G.sv.endAt=G.t+1.2; else if(G.t>=G.sv.endAt) endGame('stage'); }
}
const ticketOf = d => G.tmap[d.tid];
const byAbbr = (t,a) => t.dishes.find(d=>d.abbr===a);
const STAGES = [
  {name:'Read the ticket', sub:'Fire it, watch it, send it. Then do two at once.',

   tickets:[{at:3, covers:2, dishes:['RIB','CHP','PRN']},{after:2.5, covers:2, dishes:['LMB','BRT','RNG']}],
   on:{

  {name:'Check the pan', sub:'Ask your sections. Learn who to trust.',

  {name:'Proper rush', sub:'Ninety seconds of a Saturday. Everything at once.',

const STAGE_PASS = 55;

    stnUi[k]={c,tx};

function mkCard(t){

function statusText(d){
  if(d.dead) return 'BIN IT';
  switch(d.state){
    case 'unfired': return d.hold ? 'HOLD '+d.base+'s' : (d.refire?'REFIRE ':'FIRE ')+d.base+'s';
    case 'cooking': return 'cooking...';
    case 'plated': return (d.sel?'':'HELD ')+Math.round(d.q)+'%';

function mkPlate(t,d){
  const p=document.createElement('div'); p.className='plate'; p.dataset.did=d.id;
  p.innerHTML='<svg viewBox="0 0 38 38"><circle class="ringbg" cx="19" cy="19" r="15"/><circle class="ring" cx="19" cy="19" r="15" transform="rotate(-90 19 19)"/><text x="19" y="22" text-anchor="middle">'+d.abbr+'</text></svg><div class="tn">T'+t.table+'</div>';
  let ref=null; t.dishes.forEach(x=>{ if(x!==d&&x.ui.plate) ref=x.ui.plate; });
  if(ref&&ref.nextSibling) winEl.insertBefore(p,ref.nextSibling); else winEl.appendChild(p);
  d.ui.plate=p; d.ui.ring=p.querySelector('.ring');
}
const clockAt = t => { const m=Math.floor(t*240/G.cfg.duration); return (18+Math.floor(m/60))+':'+pad(m%60); };
function render(){
  if(!G) return;
  const m=Math.floor(G.t*240/G.cfg.duration), hh=18+Math.floor(m/60);
  $('#clock').textContent=hh+':'+pad(m%60);
  $('#wave').textContent = G.kind==='stage' ? 'Stage '+(G.stageIx+1)+' · '+G.sd.name : G.closing ? 'Closing' : waveAt(G.min).name+' · '+G.cfg.label;
  const sp=Math.round(G.sat); $('#satpct').textContent=sp+'%';
  const sf=$('#satfill'); sf.style.width=sp+'%'; sf.style.background = sp>60?'#58b368':sp>30?'#e6b04a':'#d9534f';
  const open=openTickets();
  const outBy={grill:0,pan:0,larder:0,garnish:0};
  open.forEach(t=>t.dishes.forEach(d=>{ if(d.state==='unfired'||d.state==='cooking') outBy[d.key]++; }));
  KEYS.forEach(k=>{
    const n=G.stn[k].length, u=stnUi[k];
    const fr=ST[k].free+(G.help&&G.help.key===k?HELP_HANDS:0);
    const helped=G.help&&G.help.key===k, helping=G.help&&k==='larder';
    u.c.className='stn'+(n>fr?' weeds':n>=fr-1?' busy':'')+(helped?' helped':'')+(helping?' helping':'');
    u.tx.textContent = helping ? 'on '+ST[G.help.key].tag.toLowerCase()
      : (helped ? '+larder '+Math.ceil(G.help.until-G.t)+'s' : (n>fr?'in the weeds':n>=fr-1?'busy':'calm'))+(outBy[k]?' · '+outBy[k]:'')+(k==='larder'&&G.cfg.helps?' · ✋'+G.helps:'');
  });
  openNEl.textContent=open.length;
  for(const t of open){
    if(!t.ui.card) mkCard(t);
    const age=ageOf(t);
    t.ui.timer.textContent=eating(t)?'EATING':fmt(age);
    t.ui.timer.className='tt'+(age>t.parC?' over':'')+(age>t.parC*1.6?' late':'');
    t.ui.card.className='tk'+(G.sel===t.id?' sel':'')+(age>t.parC?' over':'');
    if(t.ui.mains){ const mt=t.course===2?'MAINS · AWAY':eating(t)?'MAINS · ON HOLD, EATING STARTERS':'MAINS · ON HOLD'; if(t.ui.mtx!==mt){ t.ui.mains.textContent=mt; t.ui.mtx=mt; t.ui.mains.className='crs'+(t.course===2?' away':''); } }
    t.dishes.forEach(d=>{
      d.ui.chip.className='chip '+d.key+' s-'+d.state+(d.hold?' hold':'')+(d.dead?' dead':'')+(d.mods.allergy?' alg':'')+(d.state==='plated'&&!d.sel&&!d.dead?' held':'');
      const tx=statusText(d); if(d.ui.cstx!==tx){ d.ui.cs.textContent=tx; d.ui.cstx=tx; }
    });
    const pl=readyPlates(t), rem=remainingOf(t);
    const sk=!pl.length?'':(pl.length===rem?'full|SEND':'split|SPLIT '+pl.length+'/'+rem);
    if(t.ui.skey!==sk){
      t.ui.skey=sk; const b=t.ui.send;
      if(!sk){ b.className='tsend'; b.textContent=''; } else { const q=sk.split('|'); b.className='tsend '+q[0]; b.textContent=q[1]; }
    }
  }
  for(const t of G.tickets){
    for(const d of t.dishes){
      const inWin = !t.done && d.state==='plated';
      if(inWin&&!d.ui.plate) mkPlate(t,d);
      if(!inWin&&d.ui.plate){ d.ui.plate.remove(); d.ui.plate=null; }
      if(inWin){
        d.ui.ring.style.strokeDashoffset=(94.25*(1-d.q/100)).toFixed(1);
        d.ui.ring.style.stroke='hsl('+Math.round(d.q*1.2)+',70%,52%)';
        d.ui.plate.className='plate'+(G.sel===t.id&&d.sel?' sel':'')+(!d.sel?' off':'')+(d.dead?' dead':d.q<40?' dying':'');
      }
    }
  }
  rdotsEl.innerHTML='';
  G.runners.forEach(v=>{ el('span','rdot'+(v>0?' busy':''),rdotsEl,v>0?String(Math.ceil(v)):''); });
}

/* The receipt as a picture (1080x1350, fits Instagram and group chats). Drawn on a canvas, no assets. */
function receiptCanvas(r){
  const W=1080, H=1350, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d'), mono='ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace', sans='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const g=x.createRadialGradient(W/2,0,60,W/2,0,H); g.addColorStop(0,'#5a4526'); g.addColorStop(.55,'#2b3036'); g.addColorStop(1,'#15181b');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const L=110, R=W-110, T=90, B=H-110;
  x.fillStyle='#f6f4ee'; x.beginPath(); x.moveTo(L,T); x.lineTo(R,T); x.lineTo(R,B);
  const teeth=Math.round((R-L)/40), step=(R-L)/teeth;
  for(let i=0;i<teeth;i++){ x.lineTo(R-step*(i+.5), B+22); x.lineTo(R-step*(i+1), B); }
  x.closePath(); x.shadowColor='#0009'; x.shadowBlur=40; x.shadowOffsetY=14; x.fill(); x.shadowColor='transparent';
  const cx=W/2; let y=T+110;
  const text=(t,font,col,yy,al)=>{ x.font=font; x.fillStyle=col; x.textAlign=al||'center'; x.fillText(t,al==='left'?L+50:cx,yy); };
  const rule=yy=>{ x.strokeStyle='#1d1d1d'; x.lineWidth=4; x.setLineDash([14,10]); x.beginPath(); x.moveTo(L+50,yy); x.lineTo(R-50,yy); x.stroke(); x.setLineDash([]); };
  x.save(); x.font='800 76px '+mono; x.fillStyle='#1d1d1d'; x.textAlign='center'; if('letterSpacing' in x) x.letterSpacing='22px'; x.fillText('THE PASS',cx+11,y); x.restore();
  y+=58; text('Daily '+dnum(r.number)+' · '+r.short+' · '+niceDate(r.date),'400 32px '+mono,'#555',y);
  y+=40; rule(y);
  y+=170; text(r.rating+'%','800 170px '+sans,'#1d1d1d',y);
  y+=84; text(stars(r.rating),'400 64px '+sans,'#b9801a',y);
  const per=8, sz=62, gap=12, cols=Math.min(per,r.grid.length||1), rows=Math.ceil((r.grid.length||1)/per);
  const gx=cx-(cols*sz+(cols-1)*gap)/2; y+=50;
  const colr={g:'#58b368',a:'#e6b04a',r:'#d9534f'};
  for(let i=0;i<r.grid.length;i++){ const cxx=gx+(i%per)*(sz+gap), cy=y+Math.floor(i/per)*(sz+gap);
    x.fillStyle=colr[r.grid[i]]||'#999'; x.beginPath(); if(x.roundRect) x.roundRect(cxx,cy,sz,sz,10); else x.rect(cxx,cy,sz,sz); x.fill(); }
  y+=rows*(sz+gap)+40; rule(y);
  if(r.verdict){
    y+=58; text("CHEF'S VERDICT",'700 26px '+mono,'#8a5a00',y);
    x.font='600 38px '+sans; const words=('"'+r.verdict+'"').split(' '); let line='', lines=[];
    words.forEach(w=>{ const t=line?line+' '+w:w; if(x.measureText(t).width>R-L-120){ lines.push(line); line=w; } else line=t; }); lines.push(line);
    lines.slice(0,5).forEach(l=>{ y+=52; text(l,'600 38px '+sans,'#1d1d1d',y); });
  }
  text(siteUrl().replace(/^https?:\/\//,'').replace(/\/$/,''),'400 28px '+mono,'#777',B-46);
  return c;
}
async function shareImage(){
  const r=shareable(); if(!r){ toast('Nothing to share yet.',true); return; }
  const c=receiptCanvas(r);
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));
  if(!blob){ toast('Couldn\'t make the picture.',true); return; }
  const name='the-pass-'+r.number+'.png';
  try{
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file], text:shareText(r)}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); toast('Saved the receipt.');
}
async function doShare(){
  const r=shareable();

}

/* ---------- the chef's verdict ----------
   One blunt line on the report: a headline for the star rating, then a jab at whatever cost the most points.
   An original roasting head chef. Swearing is implied, never spelled out. Picked from the seed and score, so the
   same result always gets the same line (it goes on the share card). */
const VERDICT = {
  head:[
    ['Turn the lights off. Everyone go home.','That wasn\'t a service. That was a hostage situation.','I\'ve seen better run kitchens on a ferry.'],
    ['What... was... that?','My nan runs a tighter pass. She\'s ninety-one.','Who let you near the pass? Seriously, who?'],
    ['You got through it. Just. Barely. Somehow.','Average. And I don\'t do average.','Not a disaster. That\'s the nicest thing I\'ll say.'],
    ['Decent. Don\'t look so pleased with yourself.','Good. Not great. Good.','You\'re getting there. Slowly. Like your tickets.'],
    ['Nearly. Nearly doesn\'t get five stars.','Tidy. Very nearly properly tidy.','Strong night. I hate that I have to say it.'],
    ['Clean. Annoyingly clean.','Right. THAT is how you run a pass.','I\'ve got nothing. Don\'t get used to it.']
  ],
  walk1:['Table {t} walked out. I\'d have walked with them.','Table {t} walked. They\'re in the chippy next door, and they\'re happier.','One walkout. Table {t}. I\'ll be ringing them to apologise. You won\'t.'],
  walk:['{n} tables walked. They\'re eating chips in the car park and they\'re happier.','{n} walkouts. The dining room is emptier than your excuses.','{n} tables walked out. I\'ve had busier funerals.'],
  refire:['{n} refires. The bin had a better night than the customers.','Binned {n} plates. We\'re a kitchen, not a landfill.','{n} refires. Every one of them on my food bill.'],
  awkward:['{n} awkward splits. Half the table finished before the other half got cutlery.','Split tables left hanging. Somebody\'s date night is ruined. Cheers.','{n} splits that never landed. Pick a lane, chef.'],
  late:['Tickets crawled all night. Table {t} aged a year waiting.','The food was fine. Eventually. Eventually isn\'t a cook time.','I could have grown the veg in the time Table {t} waited.'],
  fresh:['Plates sat under that lamp so long they got a tan.','Lukewarm. Everything lukewarm. Get the table up together.','That window is a sunbed, not a pass. Get it out hot.'],
  wave:['Cruising until {w}, then you folded like a cheap napkin.','{w} chewed you up and spat you out.','Fine until {w}. Then it was carnage.'],
  clean:['Every plate hot, every table out. Go home before I find something.','No dead plates, no walkouts. Who are you and what have you done with my kitchen?','Same again tomorrow. And the day after. That\'s the job.']
};
function verdictFor(rating){
  const r=seeded(G.seed+'|verdict|'+rating);
  const n=starN(rating), all=G.scores;
  const avg=a=>a.length?a.reduce((x,y)=>x+y.s,0)/a.length:0;
  const worst=all.slice().sort((a,b)=>a.s-b.s||b.late-a.late)[0];
  const fresh=G.sentQs.length?G.sentQs.reduce((a,b)=>a+b,0)/G.sentQs.length:100;
  const late=all.length?all.filter(x=>x.late).length/all.length:0;
  let wv=null, wGap=0;
  WAVES.forEach(w=>{ const a=all.filter(x=>x.wave===w.name); if(a.length>=2){ const gap=avg(all)-avg(a); if(gap>wGap){ wGap=gap; wv=w.name; } } });
  const issues=[
    ['walk', G.walked*25], ['refire', Math.min(G.refires,5)*7], ['awkward', Math.min(G.awkward,5)*6],
    ['late', late*40], ['fresh', (88-fresh)*1.5], ['wave', wv?(wGap-6)*1.2:0]
  ].sort((a,b)=>b[1]-a[1]);
  // A five star night only gets picked on for something serious.
  const key = issues[0][1]>(n>=5?15:3) ? issues[0][0] : 'clean';
  const list = key==='walk'&&G.walked===1 ? VERDICT.walk1 : VERDICT[key];
  const fill = x => x.replace('{n}',key==='walk'?G.walked:key==='refire'?G.refires:G.awkward).replace('{t}',worst?worst.table:1).replace('{w}',wv||'The Slam');
  return pick(r,VERDICT.head[n])+' '+fill(pick(r,list));
}

function endGame(reason){
  if(G.over) return; G.over=true;
  G.tickets.forEach(t=>{ if(!t.done) walkout(t,true); });
  let sw=0,sv=0; G.scores.forEach(x=>{ sw+=x.w; sv+=x.s*x.w; });
  const rating = sw?Math.round(sv/sw):0;
  const avgT = G.waits.length ? G.waits.reduce((a,b)=>a+b,0)/G.waits.length : 0;
  const fresh = G.sentQs.length ? Math.round(G.sentQs.reduce((a,b)=>a+b,0)/G.sentQs.length) : 0;
  let isBest=false, unlockMsg='';
  save.streak=Math.max(save.streak,G.bestStreak); save.played++;
  if(G.kind==='practice'){
    isBest = rating>save.best[G.mode];
    if(isBest) save.best[G.mode]=rating;
    if(G.mode===0&&rating>=70&&save.unlocked<1){ save.unlocked=1; unlockMsg='Saturday Night unlocked.'; }
    if(G.mode===1&&rating>=75&&save.unlocked<2){ save.unlocked=2; unlockMsg='Christmas Eve unlocked.'; }
  }
  const passed = G.kind==='stage' && rating>=STAGE_PASS;
  if(passed) save.stage=Math.max(save.stage,G.stageIx+1);
  const verdict = G.kind==='stage' ? '' : verdictFor(rating);
  const res={verdict,mode:G.mode,kind:G.kind,rating,covers:G.covers,avgTicket:avgT,freshness:fresh,clean:G.clean,awkward:G.awkward,dead:G.dead,refires:G.refires,streak:G.bestStreak,reason,
             tables:G.served, walked:G.walked, grid:G.grid, seed:G.seed};
  if(G.kind==='daily'){
    Object.assign(res, {date:G.info.date, number:G.info.number, short:G.info.short});
    save.daily = {date:G.info.date, number:G.info.number, short:G.info.short, started:true, finished:true, rating, pct:rating, stars:stars(rating), grid:G.grid, verdict};
    lastDaily = save.daily;
    markLocalFinished(rating);
  }
  if(G.kind==='stage') res.stage=G.stageIx+1;
  writeSave();
  G.result=res;
  try{ if(window.PASS_HOOKS&&typeof window.PASS_HOOKS.onServiceEnd==='function') window.PASS_HOOKS.onServiceEnd(res); }catch(e){}
  if(headless) return;
  if(G.kind==='stage') return stageReport(res, passed);
  const row=(a,b)=>'<div class="rrow"><span>'+a+'</span><i></i><b>'+b+'</b></div>';
  const sub = G.kind==='daily' ? 'Daily '+dnum(G.info.number)+' · '+G.info.name+' · Pass report' : MODES[G.mode].name+' · Pass report';
  let h='<div class="card"><h1>THE PASS</h1><div class="sub">'+sub+'</div><div class="rule"></div>';
  h+='<div class="big"><div class="pct">'+rating+'%</div><div class="stars">'+stars(rating)+'</div></div>';
  if(G.kind==='daily') h+='<div class="sq">'+squares(G.grid).replace(/\n/g,'<br>')+'</div>';
  h+='<div class="chef"><small>CHEF\'S VERDICT</small>"'+esc(verdict)+'"</div>';
  h+='<div class="note'+(reason==='empty'?' bad':'')+'">'+(reason==='empty'?'The dining room walked out at '+clockAt(G.t)+'.':reason==='left'?'You left the pass at '+clockAt(G.t)+'.':'Service complete. Last table away at '+clockAt(G.t)+'.')+'</div><div class="rule"></div>';
  h+=row('Covers served',G.covers)+row('Tables away',G.served+' / '+(G.served+G.walked))+row('Average ticket time',fmt(avgT))+row('Food freshness',fresh+'%');
  h+=row('Split calls',G.clean+' clean, '+G.awkward+' awkward')+row('Dead plates / refires',G.dead+' / '+G.refires)+row('Best streak',G.bestStreak+' tables')+(G.cfg.helps?row('Larder helped out',G.helpUsed+' / '+G.cfg.helps):'');
  h+='<div class="rule"></div>';
  if(isBest&&rating>0) h+='<div class="note">New personal best.</div>';
  if(unlockMsg) h+='<div class="note">'+unlockMsg+'</div>';
  if(G.kind==='daily'){
    const sk=localStreak(G.info.date);
    h+='<div class="note dim" id="dailyNote">'+(NET.token?'Saving...':'Daily streak: '+sk+' day'+(sk===1?'':'s')+'.')+'</div>';
    h+='<button class="go" data-act="share" style="margin-top:12px">SHARE</button><button class="go alt" data-act="image">SAVE AS IMAGE</button><button class="go alt" data-act="stats">STATS</button>';
    h+='<button class="go alt" data-act="again">BACK TO THE PASS</button>';
  } else h+='<button class="go" data-act="mode" data-i="'+G.mode+'" style="margin-top:12px">GO AGAIN</button><button class="go alt" data-act="practice">PRACTICE MENU</button><button class="go alt" data-act="again">BACK TO THE PASS</button>';
  if(CHARITY.enabled) h+='<div class="stats"><a href="#" data-act="charity" style="color:#555">'+esc(CHARITY.reportLine)+'</a></div>';
  h+='</div>';
  showOverlay(h);
}
function stageReport(res, passed){
  const i=G.stageIx, sd=STAGES[i];
  let h='<div class="card"><h1>STAGE '+(i+1)+'</h1><div class="sub">'+sd.name+'</div><div class="rule"></div>';
  h+='<div class="big"><div class="pct">'+res.rating+'%</div><div class="stars">'+stars(res.rating)+'</div></div>';
  h+='<div class="verdict">"'+esc(sd.verdict(res.rating,G))+'"</div><div class="stats" style="margin-top:0">Head chef</div><div class="rule"></div>';
  if(passed && i+1<STAGES.length) h+='<button class="go" data-act="stage" data-i="'+(i+1)+'">NEXT: '+STAGES[i+1].name.toUpperCase()+'</button>';
  else if(passed) h+='<div class="note">Stage complete. You\'re ready for the daily, chef.</div><button class="go" data-act="home">TO THE PASS</button>';
  h+='<button class="go'+(passed?' alt':'')+'" data-act="stage" data-i="'+i+'">GO AGAIN</button><button class="go alt" data-act="stages">ALL STAGES</button></div>';
  showOverlay(h);
}
function nextIn(){ const ms=Date.parse(todayUtc()+'T00:00:00Z')+864e5-Date.now(); return Math.floor(ms/36e5)+'h '+Math.floor(ms%36e5/6e4)+'m'; }
function statsScreen(){
  const s=myStats(), st=todayStatus(), now=st&&st.finished?starN(st.pct):-1;
  const max=Math.max(1,...s.dist);
  const left=nextIn();
  let h='<div class="card"><h1 style="font-size:20px">STATS</h1><div class="sub">'+(NET.token?esc(NET.name):'This phone')+'</div><div class="rule"></div>';
  h+='<div class="snums"><div><b>'+s.played+'</b><small>Played</small></div><div><b>'+(s.finished?s.avg+'%':'-')+'</b><small>Average</small></div><div><b>'+s.streak+'</b><small>Current streak</small></div><div><b>'+s.bestStreak+'</b><small>Best streak</small></div></div>';
  h+='<div class="sect">STAR RATINGS</div><div class="dist">';
  for(let n=5;n>=0;n--){ const c=s.dist[n]||0; h+='<div class="drow"><span>'+('★'.repeat(n)||'none')+'</span><i class="'+(n===now?'now':'')+'" style="width:'+Math.max(8,Math.round(c/max*100))+'%">'+c+'</i></div>'; }
  h+='</div><div class="rule"></div><div class="stats" style="margin-top:4px">Next service in '+left+'</div>';
  if(st&&st.finished) h+='<button class="go" data-act="share" style="margin-top:10px">SHARE</button>';
  h+='<button class="go alt" data-act="home">BACK</button></div>';
  showOverlay(h);
}
function charityPage(){
  const c=CHARITY;
  let h='<div class="card"><h1 style="font-size:20px;letter-spacing:.15em">SUPPORT</h1><div class="sub">'+esc(c.name)+'</div><div class="rule"></div><div class="prose">';
  c.note.forEach(p=>{ h+='<p>'+esc(p)+'</p>'; });
  h+='<p style="text-align:right">'+esc(c.noteBy)+'</p></div><div class="rule"></div><div class="prose"><p><b>'+esc(c.support)+'</b></p>';
  h+='<p><a href="'+esc(c.url)+'" target="_blank" rel="noopener">Get support or donate at '+esc(c.url.replace(/^https?:\/\//,''))+'</a></p></div>';
  h+='<div class="small">'+esc(c.disclaimer)+'</div><button class="go alt" data-act="home" style="margin-top:12px">BACK</button></div>';
  showOverlay(h);
}

/* ---------- input ---------- */
document.addEventListener('pointerdown',()=>A.unlock(),{passive:true});
boardEl.addEventListener('click',e=>{
  if(!G||G.over||G.paused) return;
  const sb=e.target.closest('.tsend');
  if(sb){ const t=G.tmap[+sb.dataset.tid]; if(t&&!t.done){ G.sel=t.id; sendTicket(t); } return; }
  const ch=e.target.closest('.chip');
  if(ch){
    const d=G.dmap[+ch.dataset.did]; if(!d) return;
    if(d.state==='unfired') fireDish(d);
    else if(d.state==='cooking') checkDish(d);
    else if(d.dead) binDish(d);
    else if(d.state==='plated'){ d.sel=!d.sel; A.tap(); }
    return;
  }
  const c=e.target.closest('.tk'); if(c) selectTicket(+c.dataset.tid);
});
winEl.addEventListener('click',e=>{
  if(!G||G.over||G.paused) return;
  const p=e.target.closest('.plate'); if(!p) return;
  const d=G.dmap[+p.dataset.did]; if(!d) return;
  if(d.dead){ binDish(d); return; }
  if(d.tid!==G.sel){
    selectTicket(d.tid);
    const t=G.tmap[d.tid]; if(t&&t.ui.card&&t.ui.card.scrollIntoView) t.ui.card.scrollIntoView({block:'nearest',behavior:'smooth'});
    return;
  }
  d.sel=!d.sel; A.tap();
});
brigadeEl.addEventListener('click',e=>{ const c=e.target.closest('.stn'); if(c) sendHelp(c.dataset.k); });
$('#btnMute').addEventListener('click',()=>{ A.muted=!A.muted; save.muted=A.muted; writeSave(); setMuteIcon(); A.unlock(); Online.syncSoon(); });
$('#btnPause').addEventListener('click',()=>{ if(G&&!G.over&&!G.paused){ G.paused=true; pauseScreen(); } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G&&!G.over&&!G.paused&&!headless){ G.paused=true; pauseScreen(); } });
ovEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  e.preventDefault();
  const a=b.dataset.act;
  if(a==='mode'){ const i=+b.dataset.i; if(i<=save.unlocked){ chosenMode=i; newGame(i,{kind:'practice'}); } }
  else if(a==='practice'){ practiceMenu(); }
  else if(a==='start'){ newGame(chosenMode,{kind:'practice'}); }
  else if(a==='resume'){ G.paused=false; hideOverlay(); }
  else if(a==='quit'){ if(G&&G.kind==='daily'&&!G.over){ endGame('left'); } else { if(G) G.over=true; startScreen(); } }
  else if(a==='again'||a==='home'){ startScreen(); }
  else if(a==='dailybrief'){ dailyBrief(); }
  else if(a==='dailygo'){ startDaily(b); }
  else if(a==='report'){ dailyReportFromSave(); }
  else if(a==='share'){ doShare(); }
  else if(a==='image'){ shareImage(); }
  else if(a==='stages'){ stageMenu(); }
  else if(a==='stage'){ newGame(0,{kind:'stage', stage:+b.dataset.i}); }
  else if(a==='charity'){ charityPage(); }
  else if(a==='stats'){ statsScreen(); }
  else if(a==='account'){ Online.account(); }
  else if(Online.act) Online.act(a,b);
});

/* Starting the daily: the attempt is recorded BEFORE the first ticket prints. */
async function startDaily(btn){
  const info=dailyInfo(todayUtc());
  if(todayStatus()){ toast('You\'ve already run today\'s service.',true); startScreen(); return; }
  btn.disabled=true; btn.textContent='CHECKING IN...';
  if(NET.token){
    const r=await Online.startDaily(info.date);
    if(!r.ok){
      btn.disabled=false; btn.textContent='START THE SERVICE';
      if(r.status===409){ NET.daily={date:info.date,status:r.data.status||{started:true,finished:false}}; toast('You\'ve already run today\'s service.',true); startScreen(); }
      else toast(r.error||'Can\'t reach the pass. Try again.',true);
      return;
    }
    NET.daily={date:info.date,status:{started:true,finished:false}}; NET.streak=r.data.streak||NET.streak; if(r.data.stats) NET.stats=r.data.stats;
  }
  save.daily={date:info.date, number:info.number, short:info.short, started:true, finished:false};
  markLocalPlayed(info.date); writeSave();
  newGame(-1,{kind:'daily', daily:info});
}

/* Netlify's free plan pins a "Powered by Netlify" badge over the bottom right corner. When it is there and
   overlaps the game, keep exactly that much clear under the window so no plate or button sits beneath it. */
function fitBadge(){
  const f=document.getElementById('nl-badge-frame');
  let h=0;
  if(f){ const r=f.getBoundingClientRect(), a=$('#app').getBoundingClientRect();
    if(r.height && r.left<a.right && r.right>a.left) h=Math.ceil(innerHeight-r.top); }
  document.documentElement.style.setProperty('--badge', Math.max(0,Math.min(120,h))+'px');
}
new MutationObserver(fitBadge).observe(document.body,{childList:true});
addEventListener('resize',fitBadge);
[500,1500,4000,8000].forEach(ms=>setTimeout(fitBadge,ms));

/* ---------- boot ---------- */
loadSave(); A.muted=!!save.muted; setMuteIcon(); buildBrigade();
let lastTs=0, acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(ts-lastTs)/1000||0); lastTs=ts;
  if(headless) return;
  if(G&&!G.paused&&!G.over) update(dt);
  acc+=dt; if(acc>=.1){ acc=0; render(); }
}

/* ---------- online: optional accounts, daily attempts, stats sync (Netlify functions under /api) ---------- */
const Online = (function(){
  const online = /^https?:/.test(location.protocol);
  try{ const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); if(s&&s.token){ NET.token=s.token; NET.name=s.name; } }catch(e){}
  const keep = () => { try{ if(NET.token) localStorage.setItem(SESSION_KEY,JSON.stringify({token:NET.token,name:NET.name})); else localStorage.removeItem(SESSION_KEY); }catch(e){} };
  async function api(path, body, method){
    if(!online) return {ok:false, status:0, error:'Offline.'};
    const headers={'Content-Type':'application/json'};
    if(NET.token) headers.Authorization='Bearer '+NET.token;
    let res;
    try{ res=await fetch(path,{method:method||(body?'POST':'GET'),headers,body:body?JSON.stringify(body):undefined,cache:'no-store'}); }
    catch(e){ return {ok:false,status:0,error:'Can\'t reach the pass. Check your connection.'}; }
    const data=await res.json().catch(()=>({}));
    if(res.status===401 && NET.token && !(body&&body.action)){ NET.token=null; NET.name=null; keep(); }
    return {ok:res.ok, status:res.status, data, error:data.error||('Request failed ('+res.status+').')};
  }
  async function refresh(){
    const r=await api('/api/daily');
    if(r.ok){ NET.daily={date:r.data.today.date, status:r.data.status}; NET.streak=r.data.streak||0; NET.stats=r.data.stats; }
    if(NET.token){
      const p=await api('/api/progress');
      if(p.ok){ mergeProgress(p.data.progress); syncSoon(); }
    }
    if(!G||G.over) { if(ovEl.style.display==='flex' && /THE PASS/.test(ovEl.textContent) && $('.hero')) startScreen(); }
  }
  let syncT=null;
  function syncSoon(){ if(!NET.token) return; clearTimeout(syncT); syncT=setTimeout(()=>{ api('/api/progress',{progress:progressOf()}).then(r=>{ if(r.ok) mergeProgress(r.data.progress); }); },600); }
  async function onEnd(res){
    if(!NET.token) return;
    syncSoon();
    if(res.kind!=='daily') return;
    const r=await api('/api/daily',{action:'finish', date:res.date, pct:res.rating, grid:res.grid, covers:res.covers, tables:res.tables, walked:res.walked,
      dead:res.dead, refires:res.refires, clean:res.clean, awkward:res.awkward, freshness:res.freshness, avgTicket:res.avgTicket});
    const n=$('#dailyNote');
    if(r.ok){ NET.daily={date:res.date,status:r.data.status}; NET.streak=r.data.streak; NET.stats=r.data.stats; if(n) n.textContent='Saved. Daily streak: '+r.data.streak+' day'+(r.data.streak===1?'':'s')+'.'; }
    else if(n) n.textContent='Result not recorded: '+r.error;
  }
  async function startDaily(date){ return api('/api/daily',{action:'start',date}); }

  function account(msg){
    let h='<div class="card"><h1 style="font-size:20px">'+(NET.token?'ACCOUNT':'SIGN IN')+'</h1>';
    if(NET.token){
      h+='<div class="sub">Signed in as <b>'+esc(NET.name)+'</b></div><div class="rule"></div><div class="prose"><p>Your daily streak, stats, best scores, unlocks, Stage progress and settings follow you to any device you sign in on.</p><p>Daily streak: <b>'+NET.streak+'</b></p></div>';
      h+='<button class="go alt" data-act="logout">SIGN OUT</button><button class="go alt" data-act="home">BACK</button></div>';
      return showOverlay(h);
    }
    h+='<div class="sub">Optional. Keeps your streak and stats on every device.</div><div class="rule"></div>';
    h+='<label>CHEF NAME</label><input id="accName" maxlength="20" autocomplete="username" autocapitalize="words" value="'+esc((msg&&msg.name)||'')+'">';
    h+='<label>PIN (4 TO 6 DIGITS)</label><input id="accPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password">';
    h+='<div class="err" id="accErr">'+esc((msg&&msg.error)||'')+'</div>';
    if(msg&&msg.suggestions&&msg.suggestions.length){ h+='<div class="sugg">'; msg.suggestions.forEach(s=>{ h+='<button data-act="suggest" data-n="'+esc(s)+'">'+esc(s)+'</button>'; }); h+='</div>'; }
    h+='<button class="go" data-act="login">SIGN IN</button><button class="go alt" data-act="register">NEW CHEF: SIGN UP</button>';
    h+='<div class="stats">No two digits the same back to back in a new PIN. No email needed. Write your PIN down: there\'s no reset.</div>';
    h+='<button class="go alt" data-act="home">BACK</button></div>';
    showOverlay(h);
    const pinEl=$('#accPin'); if(pinEl) pinEl.addEventListener('keydown',e=>{ if(e.key==='Enter') auth('login'); });
    if(!msg) setTimeout(()=>{ const i=$('#accName'); if(i) i.focus(); },50);
  }
  async function auth(action){
    const name=($('#accName')||{}).value||'', pin=($('#accPin')||{}).value||'';
    const err=$('#accErr'); if(err) err.textContent='...';
    const r=await api('/api/auth',{action,name:name.trim(),pin,progress:progressOf()});
    if(!r.ok) return account({name, error:r.error, suggestions:r.data.suggestions});
    NET.token=r.data.token; NET.name=r.data.name; NET.streak=r.data.streak||0; NET.stats=r.data.stats||null; keep();
    mergeProgress(r.data.progress);
    await refresh();
    toast('Welcome to the pass, '+NET.name+'.');
    startScreen();
  }
  async function act(a,b){
    if(a==='login') return auth('login');
    if(a==='register') return auth('register');
    if(a==='suggest'){ const i=$('#accName'); if(i) i.value=b.dataset.n; return; }
    if(a==='logout'){ await api('/api/auth',{action:'logout'}); NET.token=null; NET.name=null; NET.daily=null; NET.streak=0; NET.stats=null; keep(); startScreen(); }
  }
  // Every service result goes through the existing hook.
  const prev = window.PASS_HOOKS && window.PASS_HOOKS.onServiceEnd;
  window.PASS_HOOKS = window.PASS_HOOKS || {};
  window.PASS_HOOKS.onServiceEnd = function(res){ try{ if(prev) prev(res); }catch(e){} return onEnd(res); };
  return {refresh, syncSoon, startDaily, account, act};
})();

requestAnimationFrame(frame);
startScreen();
Online.refresh();

/* handles for testing */
window.__pass = {newGame,update,render,state:()=>G,fire:fireDish,check:checkDish,select:selectTicket,send:sendSel,sendTicket,bin:binDish,endGame,save:()=>save,A,
  headless(on){ headless=!!on; }, help:sendHelp, receiptCanvas, DAYS, LAUNCH, DAILY_DURATION, dailyInfo, STAGES, shareText, seeded};

if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
